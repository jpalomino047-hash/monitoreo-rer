name: Automatización Diario COES RER

on:
  schedule:
    # 22:00 UTC equivale a las 17:00 (5:00 PM) hora de Perú (GMT-5)
    - cron: '0 22 * * *'
  workflow_dispatch: # Permite ejecución manual cuando se requiera

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Clonar repositorio
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install pandas openpyxl requests

    - name: Ejecutar procesamiento diario
      run: python script.py

    - name: Guardar y subir cambios al repositorio de GitHub
      run: |
        git config --global user.name "COES Bot"
        git config --global user.email "actions@github.com"
        git add historico_generacion_rer.csv data/data.json
        git diff --quiet && git diff --staged --quiet || (git commit -m "Actualización automática RER - $(date +'%Y-%m-%d')" && git push)
