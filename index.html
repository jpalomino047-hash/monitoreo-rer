<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard RER - COES Peru</title>
  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { 
      background-color: #0b1329; 
      color: #f8fafc; 
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
    }
    .grid-card { 
      background-color: #1e293b; 
      border-radius: 0.5rem; 
      padding: 1rem; 
      border: 1px solid #334155; 
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
    }
    .grid-card h3 { 
      font-size: 0.875rem; 
      font-weight: 600; 
      color: #cbd5e1; 
      margin-bottom: 0.5rem; 
      text-align: center; 
    }
    .grid-chart-box { 
      position: relative; 
      height: 180px; 
      width: 100%; 
    }
  </style>
</head>
<body class="p-6">

  <!-- BARRA DE CONTROL PRINCIPAL -->
  <div class="mb-6 flex flex-wrap items-center justify-between bg-slate-800 p-4 rounded-lg border border-slate-700 gap-4">
    <div>
      <h1 class="text-xl font-bold text-white">Generación RER - COES Perú</h1>
      <p class="text-xs text-slate-400">Análisis de perfiles diarios y curvas promedio por tecnología</p>
    </div>
    
    <!-- Selector dinámico de mes -->
    <div class="flex items-center space-x-3">
      <label for="select-mes" class="text-sm text-slate-300 font-medium">Seleccionar Mes:</label>
      <select id="select-mes" onchange="actualizarTodo()" class="bg-slate-900 border border-slate-700 text-white text-sm rounded-md p-2 focus:ring-2 focus:ring-orange-500 outline-none min-w-[150px]">
        <!-- Se poblará dinámicamente -->
      </select>
    </div>
  </div>

  <!-- MÓDULO COMPARATIVO SOLAR VS EÓLICA -->
  <div class="mb-8 bg-slate-800 p-5 rounded-lg border border-slate-700 shadow-lg">
    <div class="flex items-center justify-between mb-4">
      <h2 class="text-base font-semibold text-slate-100 flex items-center gap-2">
        <span>⚡</span> Comparativa Promedio Horario: Solar vs Eólica
      </h2>
    </div>

    <!-- Selectores de Centrales -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
      <div>
        <label for="select-solar" class="block text-xs font-semibold text-sky-400 mb-1">Central Solar:</label>
        <select id="select-solar" onchange="actualizarGraficoComparativo()" class="w-full bg-slate-900 border border-slate-700 text-white text-xs rounded-md p-2 outline-none focus:border-sky-500">
          <!-- Opciones dinámicas -->
        </select>
      </div>
      <div>
        <label for="select-eolica" class="block text-xs font-semibold text-purple-400 mb-1">Central Eólica:</label>
        <select id="select-eolica" onchange="actualizarGraficoComparativo()" class="w-full bg-slate-900 border border-slate-700 text-white text-xs rounded-md p-2 outline-none focus:border-purple-500">
          <!-- Opciones dinámicas -->
        </select>
      </div>
    </div>

    <!-- Canvas del Gráfico Comparativo -->
    <div class="relative h-72 w-full">
      <canvas id="chart-comparativo"></canvas>
    </div>
  </div>

  <!-- TÍTULO DE LA GRILLA INDIVIDUAL -->
  <div class="mb-4">
    <h2 class="text-base font-semibold text-slate-200">Perfiles Diarios por Central (Promedio Mensual Destacado)</h2>
  </div>

  <!-- CONTENEDOR DE LA GRILLA -->
  <div id="grid-wrapper" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4">
    <!-- Las tarjetas individuales se generan dinámicamente -->
  </div>

  <script>
    // Generación de 48 etiquetas de tiempo (00:30, 01:00, ..., 24:00)
    const etiquetas48 = Array.from({ length: 48 }, (_, i) => {
      const hh = String(Math.floor(i / 2)).padStart(2, '0');
      const mm = i % 2 === 0 ? '00' : '30';
      return `${hh}:${mm}`;
    });

    let rawData = { fechas: [], centrales: [], datos: {} };
    let gridChartInstances = [];
    let comparativoChartInstance = null;

    // 1. Carga automática de data.json (anti-cache para GitHub Pages)
    async function cargarDatosAuto() {
      try {
        const response = await fetch('./data/data.json?t=' + new Date().getTime());
        if (!response.ok) throw new Error('No se pudo descargar el JSON');
        
        rawData = await response.json();
        console.log("✅ JSON cargado exitosamente:", rawData.fechas.length, "días registrados.");
        
        poblarDesplegableMeses();
        poblarSelectoresTecnologia();
        actualizarTodo();
      } catch (error) {
        console.error("❌ Error al cargar data.json:", error);
      }
    }

    // 2. Poblar selector de meses (YYYY-MM)
    function poblarDesplegableMeses() {
      const selectMes = document.getElementById('select-mes');
      selectMes.innerHTML = '';

      if (!rawData.fechas || rawData.fechas.length === 0) return;

      const mesesSet = new Set();
      rawData.fechas.forEach(fechaStr => {
        if (!fechaStr || fechaStr.length < 7) return;
        mesesSet.add(fechaStr.substring(0, 7)); // Extrae YYYY-MM
      });

      const mesesOrdenados = Array.from(mesesSet).sort();

      const nombresMeses = {
        '01': 'Enero', '02': 'Febrero', '03': 'Marzo', '04': 'Abril',
        '05': 'Mayo', '06': 'Junio', '07': 'Julio', '08': 'Agosto',
        '09': 'Septiembre', '10': 'Octubre', '11': 'Noviembre', '12': 'Diciembre'
      };

      mesesOrdenados.forEach(mesKey => {
        const [anio, mesNum] = mesKey.split('-');
        const option = document.createElement('option');
        option.value = mesKey;
        option.textContent = `${nombresMeses[mesNum] || mesNum} ${anio}`;
        selectMes.appendChild(option);
      });

      if (mesesOrdenados.length > 0) {
        selectMes.value = mesesOrdenados[0]; // Por defecto Enero si está disponible
      }
    }

    // 3. Poblar selectores de centrales Solar vs Eólica
    function poblarSelectoresTecnologia() {
      const selectSolar = document.getElementById('select-solar');
      const selectEolica = document.getElementById('select-eolica');
      
      selectSolar.innerHTML = '';
      selectEolica.innerHTML = '';

      if (!rawData.centrales) return;

      rawData.centrales.forEach(central => {
        const optS = document.createElement('option');
        optS.value = central;
        optS.textContent = central;

        const optE = document.createElement('option');
        optE.value = central;
        optE.textContent = central;

        const cLower = central.toLowerCase();
        
        // Clasificación por palabras clave habituales
        if (cLower.includes('solar') || cLower.includes('cs') || cLower.includes('rubi') || cLower.includes('inti') || cLower.includes('reparticion') || cLower.includes('majes')) {
          selectSolar.appendChild(optS);
        } else {
          selectEolica.appendChild(optE);
        }
      });

      // Respaldos si no se clasifican por nombre
      if (selectSolar.options.length === 0) {
        rawData.centrales.forEach(c => selectSolar.add(new Option(c, c)));
      }
      if (selectEolica.options.length === 0) {
        rawData.centrales.forEach(c => selectEolica.add(new Option(c, c)));
      }
    }

    // 4. Función global de actualización
    function actualizarTodo() {
      actualizarGraficoComparativo();
      renderizarGrilla();
    }

    // 5. Renderizar Gráfico Comparativo (Solar vs Eólica)
    function actualizarGraficoComparativo() {
      const selectMes = document.getElementById('select-mes');
      const selectSolar = document.getElementById('select-solar');
      const selectEolica = document.getElementById('select-eolica');

      if (!selectMes.value || !selectSolar.value || !selectEolica.value) return;

      const mesSeleccionado = selectMes.value;
      const centralSolar = selectSolar.value;
      const centralEolica = selectEolica.value;

      const fechasDelMes = rawData.fechas.filter(f => f.startsWith(mesSeleccionado));

      const calcularPromedio = (centralName) => {
        let suma = new Array(48).fill(0);
        let cuenta = 0;

        fechasDelMes.forEach(fechaKey => {
          const vals = rawData.datos[centralName]?.[fechaKey];
          if (vals && vals.length === 48) {
            vals.forEach((v, i) => suma[i] += (v || 0));
            cuenta++;
          }
        });

        return cuenta > 0 ? suma.map(v => v / cuenta) : new Array(48).fill(0);
      };

      const promSolar = calcularPromedio(centralSolar);
      const promEolica = calcularPromedio(centralEolica);

      if (comparativoChartInstance) {
        comparativoChartInstance.destroy();
      }

      const ctx = document.getElementById('chart-comparativo').getContext('2d');
      comparativoChartInstance = new Chart(ctx, {
        type: 'line',
        data: {
          labels: etiquetas48,
          datasets: [
            {
              label: `Solar: ${centralSolar}`,
              data: promSolar,
              borderColor: '#38bdf8',
              backgroundColor: 'rgba(56, 189, 248, 0.12)',
              borderWidth: 2.5,
              pointRadius: 0,
              tension: 0.2,
              fill: true
            },
            {
              label: `Eólica: ${centralEolica}`,
              data: promEolica,
              borderColor: '#a855f7',
              backgroundColor: 'rgba(168, 85, 247, 0.12)',
              borderWidth: 2.5,
              pointRadius: 0,
              tension: 0.2,
              fill: true
            }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          interaction: { mode: 'index', intersect: false },
          plugins: {
            legend: {
              display: true,
              labels: { color: '#f8fafc', font: { size: 12 } }
            },
            tooltip: {
              callbacks: {
                label: (context) => `${context.dataset.label}: ${context.raw.toFixed(2)} MW`
              }
            }
          },
          scales: {
            x: {
              grid: { color: 'rgba(51, 65, 85, 0.3)' },
              ticks: { color: '#94a3b8', maxTicksLimit: 12 }
            },
            y: {
              beginAtZero: true,
              title: { display: true, text: 'Potencia Promedio (MW)', color: '#94a3b8' },
              grid: { color: 'rgba(51, 65, 85, 0.4)' },
              ticks: { color: '#94a3b8' }
            }
          }
        }
      });
    }

    // 6. Renderizar Grilla de Centrales Individuales
    function renderizarGrilla() {
      const selectMes = document.getElementById('select-mes');
      if (!selectMes || !selectMes.value) return;

      const mesSeleccionado = selectMes.value;
      const gridWrapper = document.getElementById('grid-wrapper');

      gridChartInstances.forEach(inst => inst.destroy());
      gridChartInstances = [];
      gridWrapper.innerHTML = '';

      const fechasDelMes = rawData.fechas.filter(f => f.startsWith(mesSeleccionado));

      rawData.centrales.forEach((central, idx) => {
        let datasets = [];
        let suma = new Array(48).fill(0);
        let cuentaDiasConData = 0;

        fechasDelMes.forEach(fechaKey => {
          const vals = rawData.datos[central]?.[fechaKey];
          
          if (vals && Array.isArray(vals) && vals.length === 48) {
            datasets.push({
              data: vals,
              borderColor: 'rgba(148, 163, 184, 0.2)',
              borderWidth: 1,
              pointRadius: 0,
              fill: false,
              order: 2
            });

            vals.forEach((v, i) => suma[i] += (v || 0));
            cuentaDiasConData++;
          }
        });

        if (cuentaDiasConData === 0) return;

        const card = document.createElement('div');
        card.className = 'grid-card';
        
        const title = document.createElement('h3');
        title.innerText = central;
        
        const box = document.createElement('div');
        box.className = 'grid-chart-box';
        
        const canvas = document.createElement('canvas');
        canvas.id = `chart-grid-${idx}`;
        
        box.appendChild(canvas);
        card.appendChild(title);
        card.appendChild(box);
        gridWrapper.appendChild(card);

        // Curva Promedio Mensual (Naranja)
        const promedio = suma.map(v => v / cuentaDiasConData);
        datasets.push({
          label: 'Promedio Mensual',
          data: promedio,
          borderColor: '#f97316',
          borderWidth: 2.2,
          pointRadius: 0,
          fill: false,
          order: 1
        });

        const ctx = canvas.getContext('2d');
        const chart = new Chart(ctx, {
          type: 'line',
          data: { labels: etiquetas48, datasets: datasets },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            animation: false,
            plugins: { legend: { display: false } },
            scales: {
              x: { ticks: { display: false }, grid: { display: false } },
              y: { 
                beginAtZero: true,
                ticks: { font: { size: 9 }, color: '#94a3b8' },
                grid: { color: 'rgba(51, 65, 85, 0.4)' }
              }
            }
          }
        });

        gridChartInstances.push(chart);
      });
    }

    // Iniciar al cargar el documento
    window.addEventListener('DOMContentLoaded', cargarDatosAuto);
  </script>
</body>
</html>
