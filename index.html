<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - Perfiles Diarios de Generación RER</title>
  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { 
      background-color: #0b1329; 
      color: #f8fafc; 
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
    }
    .grid-card { 
      background-color: #1e293b; 
      border-radius: 0.5rem; 
      padding: 1rem; 
      border: 1px solid #334155; 
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
    }
    .grid-card h3 { 
      font-size: 0.875rem; 
      font-weight: 600; 
      color: #cbd5e1; 
      margin-bottom: 0.5rem; 
      text-align: center; 
    }
    .grid-chart-box { 
      position: relative; 
      height: 180px; 
      width: 100%; 
    }
  </style>
</head>
<body class="p-6">

  <!-- BARRA DE CONTROL -->
  <div class="mb-6 flex flex-wrap items-center justify-between bg-slate-800 p-4 rounded-lg border border-slate-700 gap-4">
    <div>
      <h1 class="text-xl font-bold text-white">Perfiles Diarios de Generación</h1>
      <p class="text-xs text-slate-400">Grilla con perfil diario y curva promedio mensual destacada</p>
    </div>
    
    <div class="flex items-center space-x-4">
      <!-- Botón para carga manual si se abre como file:// (evita bloqueo CORS) -->
      <label class="cursor-pointer bg-slate-700 hover:bg-slate-600 text-slate-200 text-xs px-3 py-2 rounded-md border border-slate-600 transition flex items-center gap-2">
        <span>📁 Cargar data.json</span>
        <input type="file" id="input-json" accept=".json" class="hidden" onchange="cargarJSONManual(event)">
      </label>

      <!-- Selector dinámico de mes -->
      <div class="flex items-center space-x-2">
        <label for="select-mes" class="text-sm text-slate-300 font-medium">Seleccionar Mes:</label>
        <select id="select-mes" onchange="actualizarVista()" class="bg-slate-900 border border-slate-700 text-white text-sm rounded-md p-2 focus:ring-2 focus:ring-orange-500 outline-none min-w-[140px]">
          <!-- Se llena dinámicamente -->
        </select>
      </div>
    </div>
  </div>

  <!-- CONTENEDOR DE LA GRILLA -->
  <div id="grid-wrapper" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4">
    <!-- Las tarjetas se generan dinámicamente -->
  </div>

  <script>
    // Etiquetas de 48 tramos horarios (cada 30 min)
    const etiquetas48 = Array.from({ length: 48 }, (_, i) => {
      const hh = String(Math.floor(i / 2)).padStart(2, '0');
      const mm = i % 2 === 0 ? '00' : '30';
      return `${hh}:${mm}`;
    });

    let rawData = { fechas: [], centrales: [], datos: {} };
    let gridChartInstances = [];

    // 1. Intento de carga automática vía HTTP/Fetch
    async function cargarDatos() {
      const rutas = ['data/data.json', 'data.json', './data/data.json'];
      let cargado = false;

      for (const ruta of rutas) {
        try {
          const resp = await fetch(ruta + '?v=' + Date.now());
          if (resp.ok) {
            rawData = await resp.json();
            cargado = true;
            console.log(`✅ Data cargada automáticamente desde: ${ruta}`);
            break;
          }
        } catch (e) {
          // Si falla una ruta, prueba la siguiente
        }
      }

      if (cargado) {
        poblarDesplegableMeses();
        renderizarGrilla();
      } else {
        console.warn("⚠️ No se pudo cargar el JSON automáticamente por rutas relativas. Usa el botón 'Cargar data.json'.");
      }
    }

    // 2. Carga manual para abrir con doble clic desde el Explorador de Archivos
    function cargarJSONManual(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          rawData = JSON.parse(e.target.result);
          poblarDesplegableMeses();
          renderizarGrilla();
          console.log("✅ JSON cargado manualmente.");
        } catch (err) {
          alert("Error al parsear el archivo JSON seleccionado.");
        }
      };
      reader.readAsText(file);
    }

    // 3. Poblar el selector de meses dinámicamente (Enero a Septiembre)
    function poblarDesplegableMeses() {
      const selectMes = document.getElementById('select-mes');
      selectMes.innerHTML = '';

      if (!rawData.fechas || rawData.fechas.length === 0) return;

      const mesesSet = new Set();
      rawData.fechas.forEach(fecha => {
        if (fecha && fecha.length >= 7) {
          mesesSet.add(fecha.substring(0, 7)); // Formato YYYY-MM
        }
      });

      const mesesOrdenados = Array.from(mesesSet).sort();

      const nombresMeses = {
        '01': 'Enero', '02': 'Febrero', '03': 'Marzo', '04': 'Abril',
        '05': 'Mayo', '06': 'Junio', '07': 'Julio', '08': 'Agosto',
        '09': 'Septiembre', '10': 'Octubre', '11': 'Noviembre', '12': 'Diciembre'
      };

      mesesOrdenados.forEach(mesKey => {
        const partes = mesKey.split('-');
        const anio = partes[0];
        const mesNum = partes[1];
        const option = document.createElement('option');
        option.value = mesKey;
        option.textContent = `${nombresMeses[mesNum] || mesNum} ${anio}`;
        selectMes.appendChild(option);
      });

      // Seleccionar por defecto el mes más reciente
      if (mesesOrdenados.length > 0) {
        selectMes.value = mesesOrdenados[mesesOrdenados.length - 1];
      }
    }

    function actualizarVista() {
      renderizarGrilla();
    }

    // 4. Renderizar Grilla (Línea promedio naranja + Omitir gráficos vacíos)
    function renderizarGrilla() {
      const selectMes = document.getElementById('select-mes');
      if (!selectMes || !selectMes.value) return;

      const mesSeleccionado = selectMes.value;
      const fechasDelMes = rawData.fechas.filter(f => f.startsWith(mesSeleccionado));
      const gridWrapper = document.getElementById('grid-wrapper');

      // Limpiar instancias previas para liberar memoria
      gridChartInstances.forEach(inst => inst.destroy());
      gridChartInstances = [];
      gridWrapper.innerHTML = '';

      if (!rawData.centrales) return;

      rawData.centrales.forEach((central, idx) => {
        let datasets = [];
        let suma = new Array(48).fill(0);
        let cuentaDiasConData = 0;
        let tieneAlgúnDatoValido = false;

        fechasDelMes.forEach(fecha => {
          const vals = rawData.datos[central]?.[fecha];
          
          if (vals && Array.isArray(vals) && vals.length > 0) {
            const tramo48 = vals.slice(0, 48);
            
            // Comprobar si hay generación mayor a cero
            if (tramo48.some(v => v > 0)) {
              tieneAlgúnDatoValido = true;
            }

            // Trazo diario en gris tenue
            datasets.push({
              data: tramo48,
              borderColor: 'rgba(148, 163, 184, 0.25)',
              borderWidth: 1,
              pointRadius: 0,
              fill: false,
              order: 2
            });

            tramo48.forEach((v, i) => suma[i] += (v || 0));
            cuentaDiasConData++;
          }
        });

        // FILTRO: No dibuja la tarjeta si la central está totalmente en cero o sin data
        if (!tieneAlgúnDatoValido || cuentaDiasConData === 0) {
          return;
        }

        // Crear contenedor de la tarjeta
        const card = document.createElement('div');
        card.className = 'grid-card';
        
        const title = document.createElement('h3');
        title.innerText = central;
        
        const box = document.createElement('div');
        box.className = 'grid-chart-box';
        
        const canvas = document.createElement('canvas');
        canvas.id = `chart-grid-${idx}`;
        
        box.appendChild(canvas);
        card.appendChild(title);
        card.appendChild(box);
        gridWrapper.appendChild(card);

        // CURVA PROMEDIO MENSUAL (Naranja brillante, trazado superior)
        const promedio = suma.map(v => v / cuentaDiasConData);
        datasets.push({
          label: 'Promedio Mensual',
          data: promedio,
          borderColor: '#f97316', // Orange-500
          borderWidth: 2.5,
          pointRadius: 0,
          fill: false,
          order: 1 // Forzar renderizado por encima de las líneas grises
        });

        // Inicializar gráfico de Chart.js
        const ctx = canvas.getContext('2d');
        const chart = new Chart(ctx, {
          type: 'line',
          data: { labels: etiquetas48, datasets: datasets },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            animation: false,
            plugins: {
              legend: { display: false },
              tooltip: {
                callbacks: {
                  label: function(context) {
                    return context.dataset.label === 'Promedio Mensual'
                      ? `Promedio: ${context.parsed.y.toFixed(2)} MW`
                      : `Generación: ${context.parsed.y.toFixed(2)} MW`;
                  }
                }
              }
            },
            scales: {
              x: { ticks: { display: false }, grid: { display: false } },
              y: { 
                beginAtZero: true,
                title: { display: true, text: 'MW', font: { size: 10 } },
                ticks: { font: { size: 9 }, color: '#94a3b8' },
                grid: { color: 'rgba(51, 65, 85, 0.4)' }
              }
            }
          }
        });

        gridChartInstances.push(chart);
      });
    }

    // Ejecutar al cargar la ventana
    window.onload = cargarDatos;
  </script>
</body>
</html>
