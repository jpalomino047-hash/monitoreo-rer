<script>
    const etiquetas48 = Array.from({ length: 48 }, (_, i) => {
      const hh = String(Math.floor(i / 2)).padStart(2, '0');
      const mm = i % 2 === 0 ? '00' : '30';
      return `${hh}:${mm}`;
    });

    let rawData = { fechas: [], centrales: [], datos: {} };
    let gridChartInstances = [];

    async function cargarDatos() {
      try {
        // Anti-caché con timestamp param para forzar la lectura del nuevo JSON
        const resp = await fetch('data/data.json?v=' + Date.now());
        if (!resp.ok) {
          // Intenta ruta alternativa por si data.json está en el mismo directorio raíz
          const respAlt = await fetch('data.json?v=' + Date.now());
          rawData = await respAlt.json();
        } else {
          rawData = await resp.json();
        }
        console.log("Carga exitosa. Fechas encontradas:", rawData.fechas.length);
      } catch (err) {
        console.error("Error al cargar data.json:", err);
      }

      poblarDesplegableMeses();
      renderizarGrilla();
    }

    function poblarDesplegableMeses() {
      const selectMes = document.getElementById('select-mes');
      selectMes.innerHTML = '';

      if (!rawData.fechas || rawData.fechas.length === 0) return;

      const mesesSet = new Set();
      rawData.fechas.forEach(fecha => {
        if (fecha && fecha.length >= 7) {
          mesesSet.add(fecha.substring(0, 7)); // Obtiene YYYY-MM
        }
      });

      const mesesOrdenados = Array.from(mesesSet).sort();

      const nombresMeses = {
        '01': 'Enero', '02': 'Febrero', '03': 'Marzo', '04': 'Abril',
        '05': 'Mayo', '06': 'Junio', '07': 'Julio', '08': 'Agosto',
        '09': 'Septiembre', '10': 'Octubre', '11': 'Noviembre', '12': 'Diciembre'
      };

      mesesOrdenados.forEach(mesKey => {
        const partes = mesKey.split('-');
        const anio = partes[0];
        const mesNum = partes[1];
        const option = document.createElement('option');
        option.value = mesKey;
        option.textContent = `${nombresMeses[mesNum] || mesNum} ${anio}`;
        selectMes.appendChild(option);
      });

      // Seleccionar el último mes disponible por defecto
      if (mesesOrdenados.length > 0) {
        selectMes.value = mesesOrdenados[mesesOrdenados.length - 1];
      }
    }

    function actualizarVista() {
      renderizarGrilla();
    }

    function renderizarGrilla() {
      const selectMes = document.getElementById('select-mes');
      if (!selectMes || !selectMes.value) return;

      const mesSeleccionado = selectMes.value;
      const fechasDelMes = rawData.fechas.filter(f => f.startsWith(mesSeleccionado));
      const gridWrapper = document.getElementById('grid-wrapper');

      // Destruir instancias previas
      gridChartInstances.forEach(inst => inst.destroy());
      gridChartInstances = [];
      gridWrapper.innerHTML = '';

      if (!rawData.centrales) return;

      rawData.centrales.forEach((central, idx) => {
        let datasets = [];
        let suma = new Array(48).fill(0);
        let cuentaDiasConData = 0;
        let tieneAlgúnDatoValido = false;

        fechasDelMes.forEach(fecha => {
          const vals = rawData.datos[central]?.[fecha];
          
          if (vals && Array.isArray(vals) && vals.length > 0) {
            const tramo48 = vals.slice(0, 48);
            
            // Verificar si hay generación real en el día
            if (tramo48.some(v => v > 0)) {
              tieneAlgúnDatoValido = true;
            }

            datasets.push({
              data: tramo48,
              borderColor: 'rgba(148, 163, 184, 0.25)',
              borderWidth: 1,
              pointRadius: 0,
              fill: false,
              order: 2
            });

            tramo48.forEach((v, i) => suma[i] += (v || 0));
            cuentaDiasConData++;
          }
        });

        // Descartar centrales sin producción o vacías en este mes
        if (!tieneAlgúnDatoValido || cuentaDiasConData === 0) {
          return;
        }

        // Crear la tarjeta HTML
        const card = document.createElement('div');
        card.className = 'grid-card';
        
        const title = document.createElement('h3');
        title.innerText = central;
        
        const box = document.createElement('div');
        box.className = 'grid-chart-box';
        
        const canvas = document.createElement('canvas');
        canvas.id = `chart-grid-${idx}`;
        
        box.appendChild(canvas);
        card.appendChild(title);
        card.appendChild(box);
        gridWrapper.appendChild(card);

        // Curva del promedio mensual en Naranja
        const promedio = suma.map(v => v / cuentaDiasConData);
        datasets.push({
          label: 'Promedio Mensual',
          data: promedio,
          borderColor: '#f97316',
          borderWidth: 2.5,
          pointRadius: 0,
          fill: false,
          order: 1
        });

        const ctx = canvas.getContext('2d');
        const chart = new Chart(ctx, {
          type: 'line',
          data: { labels: etiquetas48, datasets: datasets },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            animation: false,
            plugins: {
              legend: { display: false },
              tooltip: {
                callbacks: {
                  label: function(context) {
                    return context.dataset.label === 'Promedio Mensual'
                      ? `Promedio: ${context.parsed.y.toFixed(2)} MW`
                      : `Generación: ${context.parsed.y.toFixed(2)} MW`;
                  }
                }
              }
            },
            scales: {
              x: { ticks: { display: false }, grid: { display: false } },
              y: { 
                beginAtZero: true,
                title: { display: true, text: 'MW', font: { size: 10 } },
                ticks: { font: { size: 9 }, color: '#94a3b8' },
                grid: { color: 'rgba(51, 65, 85, 0.4)' }
              }
            }
          }
        });

        gridChartInstances.push(chart);
      });
    }

    window.onload = cargarDatos;
  </script>
